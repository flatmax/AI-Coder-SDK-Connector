# Release — PyInstaller binaries on any merge into master.
#
# Triggered automatically when a pull request is merged into
# `master`, whatever the source branch is called. The previous
# version of this gate matched head branches starting with
# `dev4-`, which silently disabled releases the moment the active
# development line became `dev5-claude-code`. Branch names are a
# naming convention; `master` is the release decision, so the
# merge target is the only gate. Never triggers on direct pushes.
#
# A merged pull request is the *only* trigger. There is deliberately
# no `workflow_dispatch`: a manual run builds three ~230 MiB
# artefacts on three runners to answer a question the merge will
# answer anyway, and an unpressed button is still a button. The cost
# is that a new build or verification step stays unproven on a runner
# until a real PR carries it — verify locally against these exact
# flags and say the runner half is outstanding, rather than firing a
# run to close it.
#
# Builds per-platform single-file binaries in parallel, then
# attaches all artefacts to a GitHub Release. The release tag on
# github.com is the computed version string (not a local git tag
# — no `git tag` / `git push --tags` steps).
#
# Version string format (specs-reference/6-deployment/build.md):
#     {YYYY.MM.DD}-{HH.MM}-{short_sha}
# Date/time UTC, short_sha is the first 8 chars of HEAD.
# Written to src/aic_dc/VERSION before PyInstaller runs so the
# baked binary self-identifies. Dev checkouts leave VERSION as
# the literal "dev".
#
# The engine: `claude_agent_sdk` ships a native `claude` binary as
# package data (296.76 MiB at 0.2.137), and the wheel is
# platform-tagged, so each runner collects its own platform's
# engine. The SDK resolves that copy *before* a `claude` on PATH
# — see specs5/6-deployment/build.md § The Engine Is Not
# Bundleable — so a build that drops it silently demotes every
# user to a PATH search, and a machine without `claude` gets a
# binary that starts, renders and indexes but cannot hold a
# conversation.
#
# Hence three verification steps, in increasing strength: the
# engine is in the archive, the unpacked engine resolves and
# answers `--version`, and both of those still hold inside a
# container with no Node, Python or `claude` in it. The third is
# phase 7's stated exit criterion; the first two would all pass on
# a machine that happened to have its own engine installed.
#
# Docs extras split into two groups in pyproject.toml:
#   [docs-convert] — markitdown, pymupdf, python-pptx, openpyxl
#                    (small, ~60MB, bundled in releases)
#   [docs-enrich]  — keybert, sentence-transformers, torch
#                    (large, ~250MB+, NOT bundled; pip-install path)
#
# Users missing docs-enrich get a visible "install with
# pip install 'aic-dc[docs-enrich]'" toast per decision D1.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write  # needed to create releases and attach artefacts

jobs:
  build:
    name: Build ${{ matrix.label }}
    # Gate: PR closed events only build when the PR was actually
    # merged, not merely closed. No head-branch pattern — see the
    # header comment.
    if: github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            binary-name: aic-dc-linux
            pyinstaller-sep: ":"
          - os: windows-latest
            label: windows
            binary-name: aic-dc-windows.exe
            pyinstaller-sep: ";"
          - os: macos-latest
            label: macos
            binary-name: aic-dc-macos
            pyinstaller-sep: ":"
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git rev-parse HEAD` returns the merge
          # commit's full SHA, not a shallow stub.
          fetch-depth: 0

      # uv (not pip): uv installs from uv.lock with `--frozen`, so
      # release builds are reproducible and every platform's binary
      # is built from the same resolved versions. Pinned to the uv
      # version that produced the lock. (The original reason for
      # choosing uv here — litellm's `Requires-Python <3.14` cap,
      # which pip enforced and uv treated as advisory — left with
      # litellm in conversion phase 3.)
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          python-version: "3.14"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      # Version string: YYYY.MM.DD-HH.MM-{short_sha}
      # UTC, no seconds, 8-char SHA. Written to VERSION so the
      # baked binary self-identifies. Emitted as a step output
      # for the release job to consume.
      - name: Compute version string
        id: version
        shell: bash
        run: |
          VERSION="$(date -u +%Y.%m.%d-%H.%M)-$(git rev-parse --short=8 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > src/aic_dc/VERSION
          echo "Baked version: $VERSION"

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Build webapp (Vite)
        working-directory: webapp
        run: npm run build

      # docs-convert only — no sentence-transformers/torch. Ships
      # markitdown, pymupdf, python-pptx, openpyxl so real users
      # get Word/PDF/PowerPoint/Excel conversion out of the box.
      # --frozen installs exactly what uv.lock pins (no re-resolve),
      # so every platform's binary is built from the same versions.
      #
      # **`antigravity` is deliberately not among these**, and its
      # absence is now a decision rather than an omission
      # (specs5/plan-ag/risks.md AG-R-10). The released binary is a base
      # install: Claude, plus the `agy` transport for anyone with the
      # Antigravity CLI on PATH — which needs no wheel and is the reason
      # the extra is affordable. Adding it here would put a second
      # ~123 MiB binary into every platform's artefact for the API-key
      # route alone. The verification step below fails if it appears.
      - name: Install project with build + docs-convert extras
        run: uv sync --no-dev --extra build --extra docs-convert --frozen

      # PyInstaller command.
      #
      # --collect-submodules=aic_dc replaces what used to be a
      # hand-maintained list of every aic_dc submodule. That list
      # drifted: by 2026-08-27 it named fifteen modules deleted in
      # conversion phase 3 and none of the nineteen in
      # aic_dc.claude_code — the engine itself. A missing
      # --hidden-import only warns, so the drift was invisible.
      # Walking the package is the same belt-and-braces intent
      # without a list to forget.
      #
      # --collect-all=claude_agent_sdk is not optional: the SDK's
      # `claude` binary lives at claude_agent_sdk/_bundled/ as
      # package data, which a plain import collection drops.
      - name: Build PyInstaller binary
        shell: bash
        run: |
          SEP="${{ matrix.pyinstaller-sep }}"
          # --no-sync: use the env from the previous `uv sync` step
          # verbatim; without it `uv run` re-syncs to the default
          # groups (re-adding dev, dropping the extras).
          uv run --no-sync pyinstaller --onefile \
            --name "${{ matrix.binary-name }}" \
            --add-data "src/aic_dc/VERSION${SEP}aic_dc" \
            --add-data "src/aic_dc/config${SEP}aic_dc/config" \
            --add-data "webapp/dist${SEP}aic_dc/webapp_dist" \
            --collect-all=claude_agent_sdk \
            --collect-all=tree_sitter \
            --collect-all=tree_sitter_python \
            --collect-all=tree_sitter_javascript \
            --collect-all=tree_sitter_typescript \
            --collect-all=tree_sitter_c \
            --collect-all=tree_sitter_cpp \
            --collect-all=markitdown \
            --collect-all=fitz \
            --collect-all=pptx \
            --collect-all=openpyxl \
            --collect-submodules=aic_dc \
            --collect-submodules=jrpc_oo \
            src/aic_dc/__main__.py

      # The build-time half of R-7's tripwire
      # (specs5/plan/risks.md § R-7). Two assertions, both cheap,
      # both covering failures that otherwise surface on a user's
      # machine: that the engine went into the archive, and that
      # the binary runs at all.
      - name: Verify the bundled engine and the binary
        shell: bash
        run: |
          set -euo pipefail
          TOC="$(ls build/*/PKG-*.toc 2>/dev/null | head -1 || true)"
          if [ -z "$TOC" ]; then
            echo "::error::No PyInstaller PKG TOC under build/ — layout changed, this check needs updating."
            ls -R build | head -50
            exit 1
          fi
          if ! grep -q "_bundled" "$TOC"; then
            echo "::error::claude_agent_sdk/_bundled/claude is absent from the onefile archive."
            echo "It is resolution fallback 3 (specs5/6-deployment/build.md); without it a user"
            echo "with no 'claude' on PATH gets an app that starts, renders, indexes and cannot"
            echo "hold a conversation. Check --collect-all=claude_agent_sdk and the warn file:"
            grep -n "claude_agent_sdk" build/*/warn-*.txt || echo "(no claude_agent_sdk lines in warn file)"
            exit 1
          fi
          echo "Engine present in archive:"
          grep -o "[^'\"]*_bundled[^'\"]*" "$TOC" | sort -u | head -5
          # AG-R-10's tripwire, at build time. `google-antigravity` is an
          # optional extra and this build does not sync it, so its
          # ~123 MiB `localharness` must not be in the artefact. The risk
          # register asks for base-install size measured per release,
          # because the leak is "a pyproject.toml edit nobody reviews as
          # a size change" — and a number in a release note is something
          # a human has to notice. This is the half that fails by itself.
          if grep -qi "localharness" "$TOC"; then
            echo "::error::localharness is in the onefile archive."
            echo "google-antigravity is an optional extra (specs5/plan-ag/risks.md AG-R-10):"
            echo "the wheel bundles a second ~123 MiB binary on top of the ~297 MiB claude one."
            echo "Either it has moved back into [project.dependencies], or a --collect-all was"
            echo "added for it. The agy transport reaches the same product with no wheel."
            exit 1
          fi
          echo "Antigravity SDK correctly absent: this artefact is a base install."
          echo "Hidden-import and collection warnings (informational):"
          grep -E "missing module named aic_dc|missing module named jrpc_oo" build/*/warn-*.txt | head -20 \
            || echo "(none for aic_dc / jrpc_oo)"
          echo "Artefact:"
          ls -lh "dist/${{ matrix.binary-name }}"
          echo "Running --version:"
          "./dist/${{ matrix.binary-name }}" --version

      # The runtime half of the same tripwire, and the reason a green
      # matrix was never the exit criterion. The step above proves the
      # engine went *into* the archive; it cannot prove the process that
      # unpacks it can find and spawn it. Those are different failures:
      # --collect-all files are data, data files carry no permission
      # bits, and "present but not executable" produces an engine that
      # exists and cannot run. --check-engine resolves the binary the SDK
      # would spawn and runs it, exiting 1 when nothing resolves and 2
      # when something resolved and would not run.
      #
      # Needs no credentials and asserts nothing about them: a runner has
      # no login, and a check that required one could not run here.
      - name: Verify the binary resolves and runs its engine
        shell: bash
        run: |
          set -euo pipefail
          "./dist/${{ matrix.binary-name }}" --check-engine

      # Phase 7's actual exit criterion: "a fresh machine can install and
      # run without a manual `npm i -g @anthropic-ai/claude-code`"
      # (specs5/6-deployment/packaging.md). The runner is not a fresh
      # machine — it has Node, Python, a uv environment and this
      # repository. A container with none of them is.
      #
      # Linux only, because that is where a runner can host a container
      # cheaply. The Windows and macOS legs get the step above, which
      # exercises the same code path against the same bundled engine
      # without the clean-environment guarantee.
      #
      # ubuntu:24.04 deliberately matches the runner image. A PyInstaller
      # binary needs a glibc at least as new as the one it was built
      # against, so an older base would fail for a reason that is not the
      # one under test.
      - name: Fresh-machine test (container with no Node, Python or claude)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -euo pipefail -c '
            # Negative controls first. Without them this test could pass
            # by resolving a system engine, and a test that would pass
            # anyway proves nothing.
            for tool in claude node npm python3; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "::error::$tool is present in the test container, so the fresh-machine test is vacuous."
                exit 1
              fi
            done
            echo "Confirmed absent: claude, node, npm, python3"
            /dist/aic-dc-linux --check-engine
          '

      # Closes the other half of the packaging story: a pip-installed
      # release has to be able to serve the webapp, which means the wheel
      # carries webapp/dist at aic_dc/webapp_dist (hatch_build.py). The
      # include is conditional on the Vite build having run, and the Vite
      # build is an earlier step in this job — so this asserts on the
      # built wheel rather than trusting that ordering. Built and checked,
      # not published; putting a wheel on PyPI is a separate decision.
      - name: Verify the wheel carries the webapp
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir wheelhouse
          WHEEL="$(ls wheelhouse/*.whl | head -1)"
          echo "Built: $WHEEL"
          if ! unzip -l "$WHEEL" | grep -q "aic_dc/webapp_dist/index.html"; then
            echo "::error::$WHEEL has no aic_dc/webapp_dist/index.html."
            echo "A pip install from this wheel cannot serve the webapp and falls through"
            echo "to the GitHub Pages fallback. hatch_build.py includes webapp/dist only"
            echo "when it exists — check that the Vite build step ran before this one."
            unzip -l "$WHEEL" | head -30
            exit 1
          fi
          echo "Webapp present in wheel:"
          unzip -l "$WHEEL" | grep "webapp_dist" | head -5

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary-name }}
          path: dist/${{ matrix.binary-name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    # No condition. Anything reaching here came from a merged PR into
    # master — `needs: build` and the build job's own gate are the
    # whole answer, and a merge into master publishes by definition.
    runs-on: ubuntu-latest
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f -ls

      # Release notes: short description + per-platform download
      # table + optional-extras hint. Matches the style of the
      # previous runnable releases so existing users see a
      # familiar layout.
      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          SHORT_SHA="$(echo "$VERSION" | rev | cut -d- -f1 | rev)"
          COMMITS_URL="https://github.com/${{ github.repository }}/commits/${SHORT_SHA}"
          cat > release_notes.md <<EOF
          ## AIC-DC ${VERSION}

          [View commit history](${COMMITS_URL})

          ### Downloads

          | Platform | File | Instructions |
          |----------|------|--------------|
          | Linux | \`aic-dc-linux\` | \`chmod +x aic-dc-linux && ./aic-dc-linux\` |
          | macOS | \`aic-dc-macos\` | \`chmod +x aic-dc-macos && ./aic-dc-macos\` |
          | Windows | \`aic-dc-windows.exe\` | Double-click or run from command prompt |

          ### Requirements

          - Run from within a git repository directory.
          - Anthropic credentials for Claude Code. The binary bundles the
            \`claude\` engine, so no separate install is needed. The bundled
            copy is used even when you have your own \`claude\` on \`PATH\`;
            set \`cli_path\` in \`engine.json\` to prefer yours.

          ### Optional: keyword-enriched document mode

          Document mode works out of the box with heading outlines and
          cross-references. For keyword-enriched headings (better
          disambiguation when sections repeat), install from source:

          \`\`\`
          pip install "aic-dc[docs-enrich]"
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release_notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          make_latest: true
