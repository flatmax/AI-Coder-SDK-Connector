<!doctype html>
<!--
  The layout probe's page. Driven by scripts/layout_probe.py over CDP; not
  part of the shipped bundle, because Vite's build input is index.html and
  nothing else (webapp/vite.config.js sets no rollupOptions.input).

  The body is deliberately bare. Every scene mounts what it needs and
  removes it again, so one page answers for the dialog and for a tool card
  at three widths without a reload — and nothing on this page can lend a
  scene a style it would not have in the app.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIC⚡DC layout probe</title>
    <style>
      /* The shell's own two, and no more: the components under test carry
         their own styles, and anything else here would be the harness
         deciding how they look. */
      html, body {
        margin: 0;
        background: #0d1117;
        color: #c9d1d9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/layout-harness.js"></script>
  </body>
</html>
