# AIC-DC — AI-Coder-SDK-Connector
# Build configuration and dependencies.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aic-dc"
version = "0.0.0-dev"
description = "AI-Coder-SDK-Connector: a browser UI over AI coding-agent SDKs — Claude Code today — with tree-sitter symbol indexing, document indexing, and a Monaco diff viewer over everything the agent touches."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Flatmax Pty Ltd" },
]
keywords = ["llm", "coding-assistant", "ai", "git", "editor", "claude-code", "agent-sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

# Core runtime dependencies.
# Optional integrations live under [project.optional-dependencies].
dependencies = [
    # Claude Code engine. Owns the agent loop, tool execution, permissions,
    # compaction, and session persistence — see specs5/3-engine/. Pulls
    # `mcp` (>=1.29) for the in-process MCP server that exposes AIC-DC's
    # symbol and document indexes to the agent (specs5/plan/decisions.md CC-6).
    # This wheel is platform-tagged and ships a native `claude` binary as
    # package data (~297 MiB), which the SDK resolves in preference to a
    # `claude` on PATH; engine.json's cli_path overrides both
    # (specs5/6-deployment/build.md § The Engine Is Not Bundleable).
    "claude-agent-sdk>=0.2.136",
    # Antigravity engine — the second SDK behind the engine seam, and the
    # reason this project is called a *connector* (README § the seam is
    # deliberate). A core dependency rather than an extra: the engine layer
    # is meant to offer a choice of agent SDK, and an engine you have to
    # opt into installing is not a choice a user can make at runtime.
    #
    # Deliberately unpinned, unlike every other floor here. The others were
    # chosen after reading what the package offers; this one has not been
    # read yet. The floor gets set in the same pass that writes
    # `specs5/plan/antigravity-sdk-surface.md`, alongside the per-package
    # accounting of what it pulls in — which matters more than usual here,
    # because `claude-agent-sdk` already costs a ~295 MiB platform-tagged
    # wheel and a second engine's footprint lands on top of it, in a
    # dependency set that is now mandatory (`specs5/plan/risks.md` R-7).
    "google-antigravity",
    # Bidirectional JSON-RPC over WebSocket.
    "jrpc-oo @ git+https://github.com/flatmax/jrpc-oo.git",
    # Tree-sitter core plus grammars for supported languages.
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.21",
]

# Five dependencies left this list with the native engine, in conversion
# phase 3: the provider abstraction itself and its transitive tree; the
# tokenizer the token counter wrapped; the AWS SDK that Bedrock routing
# needed; the retry library the provider used when asked for retries; and
# the web-page extractor behind URL fetching. Nothing AIC-DC still runs
# imports any of them — the `claude` CLI resolves its own credentials,
# counts its own tokens, retries its own requests and fetches its own
# pages.

[project.optional-dependencies]
# Document-mode extras are split into two groups so release binaries
# can bundle the small conversion libraries without dragging in
# torch/sentence-transformers (~250MB per platform).
#
# docs-convert: format-conversion path (Word/PDF/PowerPoint/Excel →
# Markdown). Small, ~60MB total, bundled in PyInstaller releases.
#
# docs-enrich: keyword enrichment via KeyBERT + sentence-transformers.
# Pulls torch (CUDA wheel by default, ~800MB — use PyTorch's CPU
# index to keep installs sane). Not bundled in releases; users who
# want it install via `pip install "aic-dc[docs-enrich]"`. Missing
# keyword enrichment degrades gracefully with a toast pointing at
# the install command (per IMPLEMENTATION_NOTES.md D1).
#
# docs: back-compat alias, installs both sub-groups.
docs-convert = [
    "markitdown[all]>=0.0.1a3",
    "python-pptx>=1.0",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
]
docs-enrich = [
    "keybert>=0.8",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.24",
]
docs = [
    "aic-dc[docs-convert,docs-enrich]",
]

# Developer tooling: test runner, linters.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# Packaging: PyInstaller for single-file binary builds.
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
# CLI entry point — resolves to `aic_dc.cli:main`.
aic-dc = "aic_dc.cli:main"

[project.urls]
Homepage = "https://github.com/flatmax/AI-Coder-SDK-Connector"
Repository = "https://github.com/flatmax/AI-Coder-SDK-Connector"
Issues = "https://github.com/flatmax/AI-Coder-SDK-Connector/issues"

# ---------------------------------------------------------------------------
# Hatch build configuration
# ---------------------------------------------------------------------------

# Allow direct references (e.g. git+https) in project.dependencies.
# Required because jrpc-oo is pulled from its upstream git repo per
# IMPLEMENTATION_NOTES.md decision 8. Without this opt-in hatchling
# refuses to build the package (PEP 621 treats direct references as
# non-standard and requires explicit backend acknowledgement).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
# Sources live under src/ (src layout).
packages = ["src/aic_dc"]

[tool.hatch.build.targets.wheel]
packages = ["src/aic_dc"]

# Webapp bundling: the wheel ships webapp/dist/ at aic_dc/webapp_dist/, which
# is the third entry in aic_dc.main._find_webapp_dist's priority list, so a
# pip-installed release serves the webapp without a separate npm build. The
# include is conditional — a declarative `force-include` fails the build when
# webapp/dist is absent, which is every dev checkout before its first Vite
# build. hatch_build.py explains the trade-off and does the asking.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/aic_dc",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    # The wheel build hook — an sdist without it builds a wheel that
    # silently omits the webapp.
    "hatch_build.py",
]

# Version is declared statically in [project] above. We don't use
# [tool.hatch.version] because our __version__ is computed at import
# time from the baked VERSION file rather than assigned as a literal
# — hatch's source-path version reader expects the latter and would
# either error or silently read a stale value.

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735)
# ---------------------------------------------------------------------------
#
# uv's `[tool.uv].dev-dependencies` field is deprecated. The replacement
# is the standard `[dependency-groups]` table defined in PEP 735, which
# uv reads natively via `uv sync --group dev` (or automatically when no
# explicit group is requested and a "dev" group exists).
#
# We duplicate the dev deps into both [project.optional-dependencies].dev
# (for pip users: `pip install -e ".[dev]"`) and [dependency-groups].dev
# (for uv users: `uv sync`). Keeping both means either toolchain works
# without special flags.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# ---------------------------------------------------------------------------
# uv resolution constraints
# ---------------------------------------------------------------------------
#
# magika is a core dependency of markitdown (docs-convert extra), and
# from 0.6.3 it declares `onnxruntime<=1.20.1 ; sys_platform == 'win32'`.
# onnxruntime 1.20.1 ships no cp314 wheel on ANY platform, so in a
# universal lock that Windows cap drags onnxruntime down to 1.20.1 and
# breaks the Python 3.14 Windows release build. magika 0.6.2 has no such
# cap, which lets onnxruntime resolve to 1.27.0 (cp314 wheels on
# manylinux/macos/win_amd64/win_arm64). markitdown requires
# `magika~=0.6.1`, so <0.6.3 stays in range. Revisit once magika ships a
# release that no longer caps onnxruntime below its first cp314 wheel.
[tool.uv]
constraint-dependencies = ["magika<0.6.3"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Log-call captures show the content of every logger.* call that
# happened during a failing test. Useful for diagnostics. We keep
# them enabled but suppress the "Call stack:" trace each record
# emits alongside — that trace is pytest's auto-indent output, not
# a failure traceback, and it dominates the report without adding
# information (the logger name + message already identifies the
# emission site precisely enough).
log_auto_indent = false
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:tree_sitter.*",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Keep the default rule set small during early development.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — formatter handles; ignore for now
    "B008",  # function call in default arg — legitimate for some patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # `assert False` in tests is fine (use raise AssertionError elsewhere)